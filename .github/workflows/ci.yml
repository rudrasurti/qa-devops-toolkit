name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check WireMock mappings are valid JSON
        run: for f in wiremock/mappings/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Check Compose file
        run: docker compose config --quiet
      - name: Robot dry run
        run: |
          pip install -r requirements.txt
          robot --dryrun --output NONE --report NONE --log NONE tests/

  tests:
    name: Tests against mock API
    needs: validate
    uses: ./.github/workflows/robot-compose.yml
